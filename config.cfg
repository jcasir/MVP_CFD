# Advection Diffusion solver 1D configuration file

# Type of solver
SOLVER = ADVECTION_DIFFUSION_1D

# Grid options
GRID_POINTS = 201
DOMAIN_LENGHT = 1.0

# Simulation settings
ADVECTION_SPEED = 1.0
DIFFUSION_COEFF = 0.01
TIME_STEP = 0.001
INITIAL_TIME = 0.0
END_TIME = 1.5

# Spatial and Time schemes
SPATIAL_SCHEME = UPWIND
TIME_SCHEME = RK4

# Initial Conditions Settings
INITIAL_CONDITIONS = GAUSSIAN


#Boundary Conditions Settings
BC_LEFT = 0.0
BC_RIGHT = 0.0
BOUNDARY_CONDITIONS = PERIODIC

#Output flag
VERBOSE = true

#Results
OUTPUT_FILE = results/output.csv
MESH_FILE = results/mesh.csv
OUTPUT_FREQUENCY = 10
