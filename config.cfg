# Advection Diffusion solver 1D configuration file

# Type of solver
SOLVER = BURGERS_2D       # ADVECTION_DIFFUSION_1D | ADVECTION_DIFFUSION_2D | BURGERS_2D

#1D config values
GRID_POINTS = 201
DOMAIN_LENGHT = 2.0
ADVECTION_SPEED = 1.0
RANGE_START_IC = 0.5
RANGE_END_IC = 1.0

# Grid options
GRID_POINTS_X = 201
GRID_POINTS_Y = 201
DOMAIN_LENGHT_X = 2.0
DOMAIN_LENGHT_Y = 2.0

# Simulation settings
ADVECTION_SPEED_X = 1.0
ADVECTION_SPEED_Y = 1.0
DIFFUSION_COEFF = 0.0
TIME_STEP = 0.001
INITIAL_TIME = 0.0
END_TIME = 3.0

# Spatial and Time schemes
SPATIAL_SCHEME = QUICK
TIME_SCHEME = RK4

# Initial Conditions Settings
INITIAL_CONDITIONS = SQUARE_WAVE
AMPLITUDE_IC = 3.0
BASELINE_VALUE_IC = 1.0
RANGE_START_X_IC = 0.5 
RANGE_END_X_IC = 1.0
RANGE_START_Y_IC = 0.5
RANGE_END_Y_IC = 1.0

X0_IC = 0.5
SIGMA_IC = 0.1


# Possible value for INITIAL_CONDITIONS:
#   GAUSSIAN    (1D only)  → requires: AMPLITUDE_IC, X0_IC, SIGMA_IC
#   SQUARE_WAVE (1D e 2D)  → requires: AMPLITUDE_IC, RANGE_START_IC, RANGE_END_IC (1D)
#                                       AMPLITUDE_IC, RANGE_START_X_IC, RANGE_END_X_IC,
#                                                     RANGE_START_Y_IC, RANGE_END_Y_IC (2D)
#   SINUSOIDAL  (1D only)  → requires: AMPLITUDE_IC



#Boundary Conditions Settings
BC_LEFT = 0.0
BC_RIGHT = 0.0
BC_TOP = 0.0
BC_BOTTOM = 0.0
BOUNDARY_CONDITIONS = PERIODIC

#Output flag
VERBOSE = true

#Results
OUTPUT_DIR = results/
OUTPUT_FILE = output
MESH_FILE = mesh.csv
OUTPUT_FREQUENCY = 20
